name: render

on:
  schedule:
    - cron: "30 3 * * *"
  push:
    paths:
      - "data/**"
      - "template.md"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Aborts and names the failing source rather than rendering a zero, so a
      # bad night leaves yesterday's README in place.
      - run: bun run render

      # Renders the result through GitHub's own /markdown endpoint and measures
      # it in Chrome at 846px and 343px, light and dark. A layout that overflows
      # a phone or leaves half the desktop column empty fails here, before the
      # commit step — so it can never reach the profile.
      - name: Verify the rendered layout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run preview --check-links

      - name: Upload the preview screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview/*.png
          retention-days: 7

      # Committing README.md nightly is also what keeps the schedule trigger
      # alive: GitHub disables it after 60 days without a commit.
      - name: Commit the rendered page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data
          if git diff --quiet --cached; then
            echo "no change"
          else
            git commit -m "chore(readme): rebuild from the latest data"
            git push
          fi
